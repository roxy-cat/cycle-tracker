<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" id="metaThemeColor" content="#10b981" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>周期记 - CycleLedger</title>
  <link rel="manifest" href="./manifest.json" />
  <style>
    :root {
      --primary: #10b981;
      --primary-dark: #059669;
      --primary-light: #ecfdf5;
      --primary-shadow: rgba(16, 185, 129, 0.28);
      --bg: #f4f7f5;
      --card: #ffffff;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --border: #e2e8f0;
      --expense: #ef4444;
      --income: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.5;
      padding-top: env(safe-area-inset-top);
      padding-bottom: calc(104px + env(safe-area-inset-bottom));
      transition: background-color 0.25s ease;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
    }

    /* 顶部导航 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge {
      font-size: 11px;
      background: var(--primary-light);
      color: var(--primary-dark);
      padding: 2px 8px;
      border-radius: 99px;
      font-weight: 600;
    }

    .icon-btn {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 7px 12px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* 周期切换器 */
    .cycle-bar {
      background: var(--card);
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--border);
      margin-bottom: 14px;
    }

    .cycle-nav-btn {
      background: var(--bg);
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      color: var(--text-main);
      cursor: pointer;
    }

    .cycle-info {
      text-align: center;
    }

    .cycle-dates {
      font-size: 14px;
      font-weight: 600;
    }

    .cycle-sub {
      font-size: 12px;
      color: var(--text-sub);
    }

    .reset-cycle-btn {
      font-size: 11px;
      color: var(--primary-dark);
      background: var(--primary-light);
      border: none;
      padding: 2px 8px;
      border-radius: 6px;
      margin-left: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    /* 概览卡片 */
    .summary-card {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #ffffff;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 10px 25px -5px var(--primary-shadow);
      transition: background 0.25s ease, box-shadow 0.25s ease;
    }

    .summary-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }

    .summary-label {
      font-size: 13px;
      opacity: 0.9;
    }

    .summary-amount {
      font-size: 32px;
      font-weight: 700;
      margin-top: 2px;
      letter-spacing: -0.5px;
    }

    .daily-tag {
      background: rgba(255, 255, 255, 0.18);
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 12px;
      text-align: right;
      backdrop-filter: blur(4px);
    }

    .progress-bg {
      background: rgba(255, 255, 255, 0.25);
      height: 6px;
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .progress-fill {
      background: #ffffff;
      height: 100%;
      border-radius: 99px;
      transition: width 0.3s ease;
    }

    .summary-bottom {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      border-top: 1px solid rgba(255, 255, 255, 0.18);
      padding-top: 12px;
    }

    /* 筛选与标签切换 */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .tab-btn {
      flex: 1;
      padding: 9px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      font-size: 14px;
      font-weight: 600;
      color: var(--text-sub);
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .filter-bar input {
      flex: 1;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      font-size: 13px;
      outline: none;
    }

    .filter-bar select {
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      font-size: 13px;
    }

    /* ✅ 按天分组的账单卡片样式 */
    .day-groups {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .day-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.02);
    }

    .day-header {
      background: #f8fafc;
      padding: 9px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-sub);
    }

    .day-date-label {
      font-weight: 600;
      color: var(--text-main);
    }

    .day-totals {
      display: flex;
      gap: 10px;
      font-size: 12px;
    }

    .record-item {
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #f1f5f9;
    }

    .record-item:last-child {
      border-bottom: none;
    }

    .record-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .cat-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--primary-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .record-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
    }

    .record-note {
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
    }

    .record-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .record-amount {
      font-size: 16px;
      font-weight: 700;
    }

    .record-amount.expense { color: var(--text-main); }
    .record-amount.income { color: var(--primary-dark); }

    .del-btn {
      background: none;
      border: none;
      color: #cbd5e1;
      font-size: 15px;
      cursor: pointer;
      padding: 4px;
    }
    .del-btn:hover { color: var(--expense); }

    /* 统计图表区域 */
    .stats-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
    }

    .stat-row {
      margin-bottom: 14px;
    }

    .stat-row-top {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .stat-bar-bg {
      background: var(--bg);
      height: 8px;
      border-radius: 99px;
      overflow: hidden;
    }

    .stat-bar-fill {
      background: var(--primary);
      height: 100%;
      border-radius: 99px;
    }

    /* 右下角悬浮“记一笔”按钮 */
    .fab-add {
      position: fixed;
      right: 20px;
      bottom: calc(24px + env(safe-area-inset-bottom));
      z-index: 900;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 99px;
      height: 54px;
      padding: 0 22px;
      font-size: 16px;
      font-weight: 600;
      box-shadow: 0 8px 20px var(--primary-shadow);
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.25s ease;
    }

    .fab-add:active {
      transform: scale(0.95);
    }

    /* 弹窗样式 */
    .modal-mask {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      z-index: 1000;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-mask.show {
      display: flex;
    }

    .modal-panel {
      background: var(--card);
      width: 100%;
      max-width: 480px;
      border-radius: 20px 20px 0 0;
      padding: 20px 20px calc(24px + env(safe-area-inset-bottom));
      animation: slideUp 0.2s ease;
      max-height: 90vh;
      overflow-y: auto;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 17px;
      font-weight: 700;
    }

    .close-btn {
      background: var(--bg);
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
    }

    .type-switch {
      display: flex;
      background: var(--bg);
      padding: 4px;
      border-radius: 10px;
      margin-bottom: 14px;
    }

    .type-btn {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 8px;
      background: transparent;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }

    .type-btn.active {
      background: var(--card);
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      color: var(--primary-dark);
    }

    .cat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .cat-chip {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 4px;
      text-align: center;
      font-size: 12px;
      cursor: pointer;
      background: var(--card);
    }

    .cat-chip.active {
      border-color: var(--primary);
      background: var(--primary-light);
      color: var(--primary-dark);
      font-weight: 600;
    }

    /* 主题色选择器 */
    .theme-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .theme-chip {
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      background: var(--card);
    }

    .theme-chip.active {
      border-color: var(--primary);
      background: var(--primary-light);
    }

    .theme-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: var(--text-sub);
      margin-bottom: 6px;
    }

    .form-group input[type="number"],
    .form-group input[type="date"],
    .form-group input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 15px;
    }

    .form-group input[type="range"] {
      width: 100%;
      accent-color: var(--primary);
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
    }

    .backup-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .secondary-btn {
      flex: 1;
      padding: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
    }

    .empty-tip {
      text-align: center;
      color: var(--text-sub);
      padding: 40px 0;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 顶部栏 -->
    <div class="header">
      <h1>周期记 <span class="badge" id="cycleBadge">每月15日结转</span></h1>
      <button class="icon-btn" onclick="openSettings()">⚙️ 设置与主题</button>
    </div>

    <!-- 周期切换 -->
    <div class="cycle-bar">
      <button class="cycle-nav-btn" onclick="shiftCycle(-1)">‹</button>
      <div class="cycle-info">
        <div class="cycle-dates">
          <span id="cycleRangeText"></span>
          <button class="reset-cycle-btn" id="resetCycleBtn" style="display:none;" onclick="resetCycleOffset()">回本期</button>
        </div>
        <div class="cycle-sub" id="daysLeftText"></div>
      </div>
      <button class="cycle-nav-btn" onclick="shiftCycle(1)">›</button>
    </div>

    <!-- 核心概览卡片 -->
    <div class="summary-card">
      <div class="summary-top">
        <div>
          <div class="summary-label">本周期剩余可用预算</div>
          <div class="summary-amount" id="remainBudgetText">¥0.00</div>
        </div>
        <div class="daily-tag">
          <div>日均可用</div>
          <strong id="dailyAvgText">¥0.00</strong>
        </div>
      </div>
      <div class="progress-bg">
        <div class="progress-fill" id="budgetProgress" style="width: 0%;"></div>
      </div>
      <div class="summary-bottom">
        <span>周期支出: <strong id="totalExpenseText">¥0.00</strong></span>
        <span>周期收入: <strong id="totalIncomeText">¥0.00</strong></span>
        <span>总预算: <strong id="totalBudgetText">¥0</strong></span>
      </div>
    </div>

    <!-- 视图切换 -->
    <div class="tabs">
      <button class="tab-btn active" id="tabRecords" onclick="switchTab('records')">账单明细</button>
      <button class="tab-btn" id="tabStats" onclick="switchTab('stats')">周期统计</button>
    </div>

    <!-- 明细视图 -->
    <div id="recordsView">
      <div class="filter-bar">
        <input type="text" id="searchInput" placeholder="搜索备注或分类..." oninput="render()" />
        <select id="typeFilter" onchange="render()">
          <option value="all">全部收支</option>
          <option value="expense">仅看支出</option>
          <option value="income">仅看收入</option>
        </select>
      </div>
      <div class="day-groups" id="recordList"></div>
    </div>

    <!-- 统计视图 -->
    <div id="statsView" style="display:none;">
      <div class="stats-card" id="statsContainer"></div>
    </div>
  </div>

  <!-- 悬浮记一笔按钮（固定在屏幕右下角） -->
  <button class="fab-add" onclick="openAddModal()">
    <span style="font-size:20px;line-height:1;">+</span> 记一笔
  </button>

  <!-- 记一笔弹窗 -->
  <div class="modal-mask" id="addModal" onclick="closeModalOnMask(event, 'addModal')">
    <div class="modal-panel">
      <div class="modal-header">
        <span class="modal-title">记一笔</span>
        <button class="close-btn" onclick="closeModal('addModal')">✕</button>
      </div>

      <div class="type-switch">
        <button class="type-btn active" id="btnExpense" onclick="setRecordType('expense')">支出</button>
        <button class="type-btn" id="btnIncome" onclick="setRecordType('income')">收入</button>
      </div>

      <div class="cat-grid" id="catGrid"></div>

      <div class="form-group">
        <label>金额 (元)</label>
        <input type="number" id="amountInput" step="0.01" placeholder="0.00" inputmode="decimal" />
      </div>

      <div class="form-group">
        <label>日期</label>
        <input type="date" id="dateInput" />
      </div>

      <div class="form-group">
        <label>备注 (选填)</label>
        <input type="text" id="noteInput" placeholder="例如：午餐、稿纸、生活费..." />
      </div>

      <button class="submit-btn" onclick="saveRecord()">保存记录</button>
    </div>
  </div>

  <!-- 周期、主题与数据备份弹窗 -->
  <div class="modal-mask" id="settingsModal" onclick="closeModalOnMask(event, 'settingsModal')">
    <div class="modal-panel">
      <div class="modal-header">
        <span class="modal-title">周期、主题与备份</span>
        <button class="close-btn" onclick="closeModal('settingsModal')">✕</button>
      </div>

      <div class="form-group">
        <label>外观主题配色（点击即时预览）</label>
        <div class="theme-grid" id="themeGrid"></div>
      </div>

      <div class="form-group">
        <label>每月记账起始日 (发薪日 / 生活费日)：<strong id="startDayLabel" style="color:var(--primary-dark);">15号</strong></label>
        <input type="range" id="startDayInput" min="1" max="28" value="15" oninput="document.getElementById('startDayLabel').innerText = this.value + '号'" />
      </div>

      <div class="form-group">
        <label>单周期总预算 (元)</label>
        <input type="number" id="budgetInput" placeholder="3000" inputmode="decimal" />
      </div>

      <button class="submit-btn" onclick="saveSettings()">保存周期设置</button>

      <div class="backup-actions">
        <button class="secondary-btn" onclick="exportData()">📤 导出备份 (JSON)</button>
        <button class="secondary-btn" onclick="document.getElementById('importFile').click()">📥 导入恢复</button>
        <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importData(event)" />
      </div>
    </div>
  </div>

  <script>
    // 多色主题配置（默认：清新白绿）
    const THEMES = {
      green: {
        name: '清新白绿',
        primary: '#10b981',
        dark: '#059669',
        light: '#ecfdf5',
        bg: '#f4f7f5',
        shadow: 'rgba(16, 185, 129, 0.28)'
      },
      blue: {
        name: '晴空湛蓝',
        primary: '#2563eb',
        dark: '#1d4ed8',
        light: '#eff6ff',
        bg: '#f8fafc',
        shadow: 'rgba(37, 99, 235, 0.28)'
      },
      pink: {
        name: '樱花柔粉',
        primary: '#ec4899',
        dark: '#db2777',
        light: '#fdf2f8',
        bg: '#fdf8fa',
        shadow: 'rgba(236, 72, 153, 0.25)'
      },
      orange: {
        name: '暖阳活力',
        primary: '#f97316',
        dark: '#ea580c',
        light: '#fff7ed',
        bg: '#faf8f6',
        shadow: 'rgba(249, 115, 22, 0.25)'
      },
      purple: {
        name: '香芋微紫',
        primary: '#8b5cf6',
        dark: '#7c3aed',
        light: '#f5f3ff',
        bg: '#f8f7fc',
        shadow: 'rgba(139, 92, 246, 0.25)'
      },
      dark: {
        name: '极简石墨',
        primary: '#334155',
        dark: '#0f172a',
        light: '#f1f5f9',
        bg: '#f8fafc',
        shadow: 'rgba(15, 23, 42, 0.22)'
      }
    };

    const CATEGORIES = {
      expense: [
        { name: '餐饮', icon: '🍜' },
        { name: '交通', icon: '🚇' },
        { name: '购物', icon: '🛍️' },
        { name: '娱乐', icon: '🎮' },
        { name: '学习', icon: '📚' },
        { name: '居住', icon: '🏠' },
        { name: '医疗', icon: '💊' },
        { name: '其他', icon: '📦' }
      ],
      income: [
        { name: '工资', icon: '💰' },
        { name: '生活费', icon: '🧧' },
        { name: '兼职', icon: '💼' },
        { name: '理财', icon: '📈' },
        { name: '红包', icon: '🎁' },
        { name: '其他', icon: '✨' }
      ]
    };

    // 兼容旧版英文分类键值到中文名称的自动映射
    const LEGACY_CAT_MAP = {
      food: '餐饮',
      dining: '餐饮',
      transport: '交通',
      traffic: '交通',
      shopping: '购物',
      entertainment: '娱乐',
      game: '娱乐',
      study: '学习',
      education: '学习',
      housing: '居住',
      rent: '居住',
      medical: '医疗',
      health: '医疗',
      other: '其他',
      salary: '工资',
      allowance: '生活费',
      parttime: '兼职',
      finance: '理财',
      redpacket: '红包',
      gift: '红包'
    };

    function normalizeCategory(rawCat) {
      if (!rawCat) return '其他';
      const lower = String(rawCat).trim().toLowerCase();
      return LEGACY_CAT_MAP[lower] || rawCat;
    }

    let state = {
      startDay: 15,
      budget: 3000,
      theme: 'green',
      records: []
    };

    let cycleOffset = 0;
    let currentTab = 'records';
    let currentRecordType = 'expense';
    let selectedCategory = '餐饮';

    function applyTheme(themeKey) {
      const t = THEMES[themeKey] || THEMES.green;
      const root = document.documentElement.style;
      root.setProperty('--primary', t.primary);
      root.setProperty('--primary-dark', t.dark);
      root.setProperty('--primary-light', t.light);
      root.setProperty('--primary-shadow', t.shadow);
      root.setProperty('--bg', t.bg);
      const meta = document.getElementById('metaThemeColor');
      if (meta) meta.setAttribute('content', t.primary);
    }

    function selectTheme(themeKey) {
      state.theme = themeKey;
      applyTheme(themeKey);
      saveState();
      renderThemeGrid();
    }

    function renderThemeGrid() {
      const grid = document.getElementById('themeGrid');
      if (!grid) return;
      grid.innerHTML = Object.entries(THEMES).map(([key, t]) => `
        <div class="theme-chip ${state.theme === key ? 'active' : ''}" onclick="selectTheme('${key}')">
          <span class="theme-dot" style="background:${t.primary};"></span>
          <span>${t.name}</span>
        </div>
      `).join('');
    }

    function loadState() {
      const saved = localStorage.getItem('cycle_ledger_data_v1');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (parsed && Array.isArray(parsed.records)) {
            state = {
              startDay: parsed.startDay || 15,
              budget: parsed.budget !== undefined ? parsed.budget : 3000,
              theme: parsed.theme || 'green',
              // 自动将之前迁移过来的英文分类（如 food, study）修正为中文并恢复图标
              records: parsed.records.map(r => ({
                ...r,
                category: normalizeCategory(r.category)
              }))
            };
            saveState();
            return;
          }
        } catch (e) {}
      }

      // 兜底：若仍未迁移过旧数据，扫描旧存储键
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (!key || key === 'cycle_ledger_data_v1') continue;
        try {
          const data = JSON.parse(localStorage.getItem(key));
          const list = Array.isArray(data) ? data : (data && (data.records || data.transactions || data.list));
          if (Array.isArray(list) && list.length > 0) {
            state.records = list.map((item, idx) => ({
              id: item.id || (Date.now() + idx),
              type: item.type || 'expense',
              category: normalizeCategory(item.category),
              amount: Number(item.amount) || 0,
              date: item.date || formatDate(new Date()),
              note: item.note || item.desc || item.remark || ''
            }));
            if (data.startDay) state.startDay = Number(data.startDay);
            if (data.budget) state.budget = Number(data.budget);
            saveState();
            break;
          }
        } catch (e) {}
      }
    }

    function saveState() {
      localStorage.setItem('cycle_ledger_data_v1', JSON.stringify(state));
    }

    function formatDate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function formatDayHeader(dateStr) {
      const parts = dateStr.split('-');
      if (parts.length !== 3) return dateStr;
      const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      const weeks = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
      const todayStr = formatDate(new Date());
      const tag = dateStr === todayStr ? ' · 今天' : '';
      return `${Number(parts[1])}月${Number(parts[2])}日 ${weeks[d.getDay()]}${tag}`;
    }

    function getCycleRange(offset = 0) {
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const sd = state.startDay;

      let baseYear = today.getFullYear();
      let baseMonth = today.getMonth();
      if (today.getDate() < sd) {
        baseMonth -= 1;
      }

      const start = new Date(baseYear, baseMonth + offset, sd);
      const nextStart = new Date(baseYear, baseMonth + offset + 1, sd);
      const end = new Date(nextStart.getTime() - 86400000);

      return { start, end, nextStart, today };
    }

    function shiftCycle(delta) {
      cycleOffset += delta;
      render();
    }

    function resetCycleOffset() {
      cycleOffset = 0;
      render();
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tabRecords').classList.toggle('active', tab === 'records');
      document.getElementById('tabStats').classList.toggle('active', tab === 'stats');
      document.getElementById('recordsView').style.display = tab === 'records' ? 'block' : 'none';
      document.getElementById('statsView').style.display = tab === 'stats' ? 'block' : 'none';
      render();
    }

    function render() {
      const { start, end, nextStart, today } = getCycleRange(cycleOffset);
      const startStr = formatDate(start);
      const endStr = formatDate(end);

      document.getElementById('cycleBadge').innerText = `每月${state.startDay}日结转`;
      document.getElementById('cycleRangeText').innerText = `${start.getMonth() + 1}月${start.getDate()}日 - ${end.getMonth() + 1}月${end.getDate()}日`;
      document.getElementById('resetCycleBtn').style.display = cycleOffset !== 0 ? 'inline-block' : 'none';

      let daysLeft = 1;
      if (cycleOffset === 0) {
        daysLeft = Math.max(1, Math.ceil((nextStart - today) / 86400000));
        document.getElementById('daysLeftText').innerText = `距下次结转还有 ${daysLeft} 天`;
      } else if (cycleOffset < 0) {
        document.getElementById('daysLeftText').innerText = `历史周期（已结束）`;
      } else {
        daysLeft = Math.max(1, Math.ceil((nextStart - start) / 86400000));
        document.getElementById('daysLeftText').innerText = `未来周期（共 ${daysLeft} 天）`;
      }

      const cycleRecords = state.records.filter(r => r.date >= startStr && r.date <= endStr);
      const totalExpense = cycleRecords.filter(r => r.type === 'expense').reduce((s, r) => s + r.amount, 0);
      const totalIncome = cycleRecords.filter(r => r.type === 'income').reduce((s, r) => s + r.amount, 0);

      const remainBudget = state.budget - totalExpense;
      const dailyAvg = remainBudget > 0 ? (remainBudget / daysLeft) : 0;
      const pct = state.budget > 0 ? Math.min(100, Math.max(0, (totalExpense / state.budget) * 100)) : 0;

      document.getElementById('remainBudgetText').innerText = `¥${remainBudget.toFixed(2)}`;
      document.getElementById('dailyAvgText').innerText = `¥${dailyAvg.toFixed(2)}`;
      document.getElementById('budgetProgress').style.width = `${pct}%`;
      document.getElementById('totalExpenseText').innerText = `¥${totalExpense.toFixed(2)}`;
      document.getElementById('totalIncomeText').innerText = `¥${totalIncome.toFixed(2)}`;
      document.getElementById('totalBudgetText').innerText = `¥${state.budget}`;

      if (currentTab === 'records') {
        renderRecords(cycleRecords);
      } else {
        renderStats(cycleRecords, totalExpense);
      }
    }

    // ✅ 按天分组渲染，每天独立成组并展示当日收支合计
    function renderRecords(cycleRecords) {
      const kw = document.getElementById('searchInput').value.trim().toLowerCase();
      const tf = document.getElementById('typeFilter').value;

      const filtered = cycleRecords
        .filter(r => tf === 'all' || r.type === tf)
        .filter(r => !kw || r.category.toLowerCase().includes(kw) || (r.note && r.note.toLowerCase().includes(kw)))
        .sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);

      const listEl = document.getElementById('recordList');
      if (filtered.length === 0) {
        listEl.innerHTML = `<div class="empty-tip">当前周期暂无符合条件的账单<br>点击右下角「+ 记一笔」开始记录</div>`;
        return;
      }

      // 按日期聚合
      const groups = {};
      filtered.forEach(r => {
        if (!groups[r.date]) groups[r.date] = [];
        groups[r.date].push(r);
      });

      listEl.innerHTML = Object.entries(groups).map(([date, items]) => {
        const dayExp = items.filter(i => i.type === 'expense').reduce((s, i) => s + i.amount, 0);
        const dayInc = items.filter(i => i.type === 'income').reduce((s, i) => s + i.amount, 0);

        const rowsHtml = items.map(r => {
          const catObj = [...CATEGORIES.expense, ...CATEGORIES.income].find(c => c.name === r.category) || { icon: '📦' };
          const sign = r.type === 'expense' ? '-' : '+';
          return `
            <div class="record-item">
              <div class="record-left">
                <div class="cat-icon">${catObj.icon}</div>
                <div>
                  <div class="record-title">${escapeHtml(r.category)}</div>
                  ${r.note ? `<div class="record-note">${escapeHtml(r.note)}</div>` : ''}
                </div>
              </div>
              <div class="record-right">
                <div class="record-amount ${r.type}">${sign}¥${r.amount.toFixed(2)}</div>
                <button class="del-btn" onclick="deleteRecord(${r.id})" title="删除">✕</button>
              </div>
            </div>
          `;
        }).join('');

        return `
          <div class="day-card">
            <div class="day-header">
              <span class="day-date-label">${formatDayHeader(date)}</span>
              <div class="day-totals">
                ${dayExp > 0 ? `<span>支 <strong>¥${dayExp.toFixed(2)}</strong></span>` : ''}
                ${dayInc > 0 ? `<span style="color:var(--primary-dark);">收 <strong>¥${dayInc.toFixed(2)}</strong></span>` : ''}
              </div>
            </div>
            <div>${rowsHtml}</div>
          </div>
        `;
      }).join('');
    }

    function renderStats(cycleRecords, totalExpense) {
      const container = document.getElementById('statsContainer');
      const expenses = cycleRecords.filter(r => r.type === 'expense');
      if (expenses.length === 0) {
        container.innerHTML = `<div class="empty-tip">本周期暂无支出数据可统计</div>`;
        return;
      }

      const map = {};
      expenses.forEach(r => {
        map[r.category] = (map[r.category] || 0) + r.amount;
      });

      const sorted = Object.entries(map).sort((a, b) => b[1] - a[1]);
      container.innerHTML = `<div style="font-weight:700;margin-bottom:14px;font-size:15px;">支出分类占比 (共 ¥${totalExpense.toFixed(2)})</div>` +
        sorted.map(([cat, amt]) => {
          const pct = totalExpense > 0 ? ((amt / totalExpense) * 100).toFixed(1) : 0;
          const catObj = CATEGORIES.expense.find(c => c.name === cat) || { icon: '📦' };
          return `
            <div class="stat-row">
              <div class="stat-row-top">
                <span>${catObj.icon} ${escapeHtml(cat)} (${pct}%)</span>
                <strong>¥${amt.toFixed(2)}</strong>
              </div>
              <div class="stat-bar-bg">
                <div class="stat-bar-fill" style="width:${pct}%;"></div>
              </div>
            </div>
          `;
        }).join('');
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    function openAddModal() {
      document.getElementById('dateInput').value = formatDate(new Date());
      document.getElementById('amountInput').value = '';
      document.getElementById('noteInput').value = '';
      setRecordType('expense');
      document.getElementById('addModal').classList.add('show');
    }

    function setRecordType(type) {
      currentRecordType = type;
      document.getElementById('btnExpense').classList.toggle('active', type === 'expense');
      document.getElementById('btnIncome').classList.toggle('active', type === 'income');
      selectedCategory = CATEGORIES[type][0].name;
      renderCategoryGrid();
    }

    function renderCategoryGrid() {
      const grid = document.getElementById('catGrid');
      grid.innerHTML = CATEGORIES[currentRecordType].map(c => `
        <div class="cat-chip ${c.name === selectedCategory ? 'active' : ''}" onclick="selectCategory('${c.name}')">
          <div style="font-size:18px;margin-bottom:2px;">${c.icon}</div>
          <div>${c.name}</div>
        </div>
      `).join('');
    }

    function selectCategory(name) {
      selectedCategory = name;
      renderCategoryGrid();
    }

    function saveRecord() {
      const amount = parseFloat(document.getElementById('amountInput').value);
      const date = document.getElementById('dateInput').value;
      const note = document.getElementById('noteInput').value.trim();

      if (!amount || amount <= 0) {
        alert('请输入有效金额');
        return;
      }
      if (!date) {
        alert('请选择日期');
        return;
      }

      state.records.push({
        id: Date.now(),
        type: currentRecordType,
        category: selectedCategory,
        amount,
        date,
        note
      });

      saveState();
      closeModal('addModal');
      render();
    }

    function deleteRecord(id) {
      if (!confirm('确定删除这条记录吗？')) return;
      state.records = state.records.filter(r => r.id !== id);
      saveState();
      render();
    }

    function openSettings() {
      renderThemeGrid();
      document.getElementById('startDayInput').value = state.startDay;
      document.getElementById('startDayLabel').innerText = `${state.startDay}号`;
      document.getElementById('budgetInput').value = state.budget;
      document.getElementById('settingsModal').classList.add('show');
    }

    function saveSettings() {
      const sd = parseInt(document.getElementById('startDayInput').value, 10);
      const bg = parseFloat(document.getElementById('budgetInput').value) || 0;
      state.startDay = Math.min(28, Math.max(1, sd));
      state.budget = bg;
      cycleOffset = 0;
      saveState();
      closeModal('settingsModal');
      render();
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `cycle-ledger-backup-${formatDate(new Date())}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (Array.isArray(parsed.records)) {
            state = {
              startDay: parsed.startDay || 15,
              budget: parsed.budget !== undefined ? parsed.budget : 3000,
              theme: parsed.theme || state.theme || 'green',
              records: parsed.records.map(r => ({
                ...r,
                category: normalizeCategory(r.category)
              }))
            };
            saveState();
            applyTheme(state.theme);
            closeModal('settingsModal');
            render();
            alert('数据恢复成功！');
          } else {
            alert('备份文件格式不正确');
          }
        } catch (err) {
          alert('无法解析该备份文件');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('show');
    }

    function closeModalOnMask(e, id) {
      if (e.target.id === id) closeModal(id);
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    loadState();
    applyTheme(state.theme);
    render();
  </script>
</body>
</html>
